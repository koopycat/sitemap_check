---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BINARY_NAME: sitemap_check

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected a SemVer tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="${BINARY_NAME}_${version}_${GOOS}_${GOARCH}"
          package_dir="dist/${archive}"
          binary="$BINARY_NAME"
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          mkdir -p "$package_dir"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${version}" \
            -o "${package_dir}/${binary}" \
            .
          cp README.md "$package_dir/"

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            actual_version="$("${package_dir}/${binary}" --version)"
            if [[ "$actual_version" != "$version" ]]; then
              echo "::error title=Version mismatch::Expected ${version}, got ${actual_version}"
              exit 1
            fi
          fi

          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -q -r "${archive}.zip" "$archive")
          else
            tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum sitemap_check_* | LC_ALL=C sort -k2 > checksums.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi

          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${BINARY_NAME} ${GITHUB_REF_NAME}" \
            "${prerelease_args[@]}"

  homebrew:
    name: Update Homebrew formula
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: koopycat/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Generate formula
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          darwin_arm64_sha="$(sha256sum "dist/${BINARY_NAME}_${version}_darwin_arm64.tar.gz" | awk '{print $1}')"
          darwin_amd64_sha="$(sha256sum "dist/${BINARY_NAME}_${version}_darwin_amd64.tar.gz" | awk '{print $1}')"
          linux_arm64_sha="$(sha256sum "dist/${BINARY_NAME}_${version}_linux_arm64.tar.gz" | awk '{print $1}')"
          linux_amd64_sha="$(sha256sum "dist/${BINARY_NAME}_${version}_linux_amd64.tar.gz" | awk '{print $1}')"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/sitemap-check.rb <<EOF
          class SitemapCheck < Formula
            desc "Check every URL contained in an XML sitemap"
            homepage "https://github.com/koopycat/sitemap_check"
            version "${version}"

            on_macos do
              on_arm do
                url "https://github.com/koopycat/sitemap_check/releases/download/v#{version}/sitemap_check_#{version}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                url "https://github.com/koopycat/sitemap_check/releases/download/v#{version}/sitemap_check_#{version}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/koopycat/sitemap_check/releases/download/v#{version}/sitemap_check_#{version}_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "https://github.com/koopycat/sitemap_check/releases/download/v#{version}/sitemap_check_#{version}_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "sitemap_check"
            end

            test do
              assert_equal version.to_s, shell_output("#{bin}/sitemap_check --version").strip
            end
          end
          EOF

          ruby -c homebrew-tap/Formula/sitemap-check.rb

      - name: Commit and push formula
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- Formula/sitemap-check.rb)" ]]; then
            echo "Formula is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/sitemap-check.rb
          git commit -m "Update sitemap-check to ${GITHUB_REF_NAME}"
          git push
